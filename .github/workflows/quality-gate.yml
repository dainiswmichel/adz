name: Production quality gate

on:
  push:
    branches: [main]
    paths:
      - 'pre-release-candidates/dwm-local/**'
      - 'pre-release-candidates/site-theme/adz-world-2026/**'
      - 'tools/**'
      - 'phpcs.xml.dist'
      - '.github/scripts/check-version.sh'
      - '.github/workflows/quality-gate.yml'
  pull_request:
    paths:
      - 'pre-release-candidates/dwm-local/**'
      - 'pre-release-candidates/site-theme/adz-world-2026/**'
      - 'tools/**'
      - 'phpcs.xml.dist'
      - '.github/scripts/check-version.sh'
      - '.github/workflows/quality-gate.yml'
  workflow_call:
    inputs:
      release_tag:
        description: Numeric WordPress.org release tag, without a leading v.
        required: false
        type: string
        default: ''

jobs:
  quality:
    name: Production quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction wp-coding-standards/wpcs dealerdirect/phpcodesniffer-composer-installer

      - name: Verify release metadata
        run: ./.github/scripts/check-version.sh "${{ inputs.release_tag }}"

      - name: Lint every production PHP file
        run: |
          find pre-release-candidates/dwm-local \
            pre-release-candidates/site-theme/adz-world-2026 \
            -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Parse every production JavaScript file
        run: |
          find pre-release-candidates/dwm-local \
            pre-release-candidates/site-theme/adz-world-2026 \
            -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Parse every production JSON file
        run: |
          find pre-release-candidates/site-theme/adz-world-2026 -name '*.json' -print0 \
            | xargs -0 -n1 php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);'

      - name: Run full WPCS
        run: |
          ~/.composer/vendor/bin/phpcs --standard=phpcs.xml.dist \
            pre-release-candidates/dwm-local \
            pre-release-candidates/site-theme/adz-world-2026

      - name: Enforce WordPress.org release invariants
        shell: bash
        run: |
          set -euo pipefail
          BUILD=pre-release-candidates/dwm-local
          THEME=pre-release-candidates/site-theme/adz-world-2026

          if grep -RInE --include='*.php' --include='*.js' \
            'style=|<style|wp_add_inline_style|\.style[[:space:]]*=' "$BUILD"; then
            echo 'Inline or runtime styling is forbidden in the release.' >&2
            exit 1
          fi

          if grep -RInE --include='*.php' \
            'phpcs:(ignore|disable)|@codingStandardsIgnore' "$BUILD"; then
            echo 'Suppressed coding-standard diagnostics are forbidden in the release.' >&2
            exit 1
          fi

          if grep -RInE --include='*.php' --include='*.js' --include='*.html' \
            'style=|<style|wp_add_inline_style|\.style[[:space:]]*=' "$THEME"; then
            echo 'Inline or runtime styling is forbidden in the production theme.' >&2
            exit 1
          fi

          if grep -RInE --include='*.php' \
            'phpcs:(ignore|disable)|@codingStandardsIgnore' "$THEME"; then
            echo 'Suppressed coding-standard diagnostics are forbidden in the production theme.' >&2
            exit 1
          fi

          if grep -RInE --include='*.php' --include='*.js' \
            'wp-admin/admin-ajax\.php|screen_icon[[:space:]]*\(|role_exists[[:space:]]*\(' "$BUILD"; then
            echo 'A previously reported WordPress.org defect has returned.' >&2
            exit 1
          fi

          if find "$BUILD" -type f -iname '*chosen*' -print -quit | grep -q .; then
            echo 'The unmaintained Chosen library must not ship.' >&2
            exit 1
          fi

          while IFS= read -r -d '' file; do
            if ! grep -qE "defined\([[:space:]]*'ABSPATH'[[:space:]]*\)" "$file"; then
              echo "Missing ABSPATH direct-access guard: $file" >&2
              exit 1
            fi
          done < <(find "$BUILD" -type f -name '*.php' -print0)

          if grep -RInE --include='*.php' --include='*.js' --include='*.css' \
            --include='*.txt' --include='*.md' --include='*.html' --include='*.pot' \
            --include='*.po' '[[:blank:]]+$' "$BUILD"; then
            echo 'Trailing whitespace is forbidden in the production tree.' >&2
            exit 1
          fi

          if grep -RInE --include='*.php' --include='*.js' --include='*.css' \
            --include='*.json' --include='*.html' '[[:blank:]]+$' "$THEME"; then
            echo 'Trailing whitespace is forbidden in the production theme.' >&2
            exit 1
          fi

      - name: Run production regression checks
        run: |
          php tools/tests/test-matching.php pre-release-candidates/dwm-local
          php tools/tests/test-preferences.php pre-release-candidates/dwm-local
          php tools/resolve-calls.php pre-release-candidates/dwm-local \
            | tee /tmp/adzworld-call-resolution.txt
          grep -q '0 of them this codebase.s own.*, 0 arity, 0 duplicate' /tmp/adzworld-call-resolution.txt

      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './pre-release-candidates/dwm-local'
          slug: adz-world
          strict: true
