# Deploys the plugin to the WordPress.org directory.
#
# Publishing a GitHub release commits pre-release-candidates/dwm-local/ to SVN
# trunk and creates the matching SVN tag. Nothing deploys on an ordinary push.
#
# Requires two repository secrets, under Settings > Secrets and variables >
# Actions:
#   SVN_USERNAME  your WordPress.org username
#   SVN_PASSWORD  the dedicated SVN password from your WordPress.org profile
#                 (Account & Security > SVN credentials). The normal login
#                 password does not work for SVN.

name: Deploy to WordPress.org

on:
  release:
    types: [released]

  # Lets a deploy be rehearsed by hand without publishing a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to rehearse, e.g. 1.0.9"
        required: true
      dry_run:
        description: "Skip the SVN commit"
        type: boolean
        default: true

jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml
    with:
      release_tag: ${{ github.event.release.tag_name || inputs.tag }}

  deploy:
    name: Deploy to WP.org
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ inputs.dry_run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # The repository is named "adz"; the directory slug is "adz-world".
          SLUG: adz-world
          # Only the production codebase is deployed. Candidates and ancestor never ship.
          BUILD_DIR: pre-release-candidates/dwm-local
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
